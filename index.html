<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वैदिक ऋचा — Daily Vedic Hymn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800;900&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0d0705;
            --card: rgba(35, 18, 8, 0.75);
            --border: rgba(212, 160, 60, 0.2);
            --accent: #d4a03c;
            --accent-bright: #f0c040;
            --text: #f0e0c8;
            --muted: #8a7560;
            --glow: rgba(212, 160, 60, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans Devanagari', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-shloka {
            font-family: 'Tiro Devanagari Hindi', 'Noto Sans Devanagari', serif;
        }

        /* ===== बैकग्राउंड कैनवास ===== */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(180, 120, 30, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(160, 80, 20, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, rgba(13,7,5,0.3) 0%, rgba(13,7,5,0.8) 100%);
        }

        .main-content {
            position: relative;
            z-index: 10;
        }

        /* ===== ग्लो इफेक्ट्स ===== */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: orbFloat 8s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        /* ===== ऋचा कार्ड ===== */
        .richa-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .richa-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        /* ===== संस्कृत ऋचा ===== */
        .sanskrit-text {
            font-size: 1.55rem;
            line-height: 2.2;
            letter-spacing: 0.04em;
            color: var(--accent-bright);
            text-shadow: 0 0 30px rgba(240, 192, 64, 0.2);
            text-align: center;
        }

        /* ===== ऑडियो प्लेयर ===== */
        .audio-player {
            background: rgba(20, 10, 4, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
        }

        .play-btn {
            width: 48px; height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #b8860b);
            border: none;
            color: #1a0a00;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(212, 160, 60, 0.4);
        }

        .play-btn.playing {
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(212, 160, 60, 0.3); }
            50% { box-shadow: 0 0 30px rgba(212, 160, 60, 0.6); }
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(212, 160, 60, 0.15);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-bright));
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* ===== व्याख्या कार्ड्स ===== */
        .vyakhya-card {
            background: rgba(25, 12, 5, 0.7);
            border: 1px solid rgba(212, 160, 60, 0.12);
            border-radius: 12px;
            padding: 20px 22px;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .vyakhya-card::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--guru-color, var(--accent));
            border-radius: 0 2px 2px 0;
        }

        .vyakhya-card:hover {
            border-color: rgba(212, 160, 60, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .guru-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ===== नेविगेशन ===== */
        .nav-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(35, 18, 8, 0.6);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 0.9rem;
        }

        .nav-btn:hover {
            background: rgba(212, 160, 60, 0.15);
            border-color: var(--accent);
            color: var(--accent-bright);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ===== वेद चयन ===== */
        .ved-tab {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(212, 160, 60, 0.15);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .ved-tab.active {
            background: linear-gradient(135deg, rgba(212, 160, 60, 0.2), rgba(180, 120, 30, 0.15));
            border-color: var(--accent);
            color: var(--accent-bright);
            box-shadow: 0 0 15px rgba(212, 160, 60, 0.15);
        }

        .ved-tab:hover:not(.active) {
            border-color: rgba(212, 160, 60, 0.4);
            color: var(--text);
        }

        /* ===== डाउनलोड बटन ===== */
        .download-btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            background: linear-gradient(135deg, rgba(212, 160, 60, 0.15), rgba(180, 120, 30, 0.1));
            color: var(--accent-bright);
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans Devanagari', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, rgba(212, 160, 60, 0.3), rgba(180, 120, 30, 0.2));
            box-shadow: 0 0 25px rgba(212, 160, 60, 0.2);
            transform: translateY(-1px);
        }

        /* ===== स्क्रॉल एनिमेशन ===== */
        .fade-in {
            opacity: 0;
            transform: translateY(25px);
            transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== दीपक एनिमेशन ===== */
        .diya-flame {
            animation: flicker 2s ease-in-out infinite alternate;
        }

        @keyframes flicker {
            0% { transform: scaleY(1) scaleX(1); opacity: 0.9; }
            25% { transform: scaleY(1.05) scaleX(0.95); opacity: 1; }
            50% { transform: scaleY(0.95) scaleX(1.05); opacity: 0.85; }
            75% { transform: scaleY(1.08) scaleX(0.98); opacity: 0.95; }
            100% { transform: scaleY(1) scaleX(1.02); opacity: 0.9; }
        }

        /* ===== तरंग एनिमेशन (ऑडियो) ===== */
        .wave-bar {
            width: 3px;
            background: var(--accent);
            border-radius: 2px;
            transition: height 0.15s ease;
        }

        .wave-bar.active {
            animation: waveAnim 0.6s ease-in-out infinite alternate;
        }

        @keyframes waveAnim {
            0% { height: 4px; }
            100% { height: 20px; }
        }

        /* ===== टोस्ट ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(35, 18, 8, 0.95);
            border: 1px solid var(--accent);
            color: var(--accent-bright);
            padding: 14px 28px;
            border-radius: 10px;
            z-index: 9999;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== ओम पल्स ===== */
        .om-pulse {
            animation: omPulse 4s ease-in-out infinite;
        }

        @keyframes omPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(212, 160, 60, 0.3); }
            50% { text-shadow: 0 0 40px rgba(212, 160, 60, 0.6), 0 0 80px rgba(212, 160, 60, 0.2); }
        }

        /* ===== शेयर बटन ===== */
        .share-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(25, 12, 5, 0.6);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .share-btn:hover {
            border-color: var(--accent);
            color: var(--accent-bright);
            background: rgba(212, 160, 60, 0.1);
        }

        /* ===== रिस्पॉन्सिव ===== */
        @media (max-width: 768px) {
            .sanskrit-text { font-size: 1.2rem; line-height: 2; }
            .vyakhya-card { padding: 16px 18px; }
        }

        @media (max-width: 480px) {
            .sanskrit-text { font-size: 1.05rem; line-height: 1.9; }
        }

        /* ===== स्क्रॉलबार ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: rgba(212, 160, 60, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(212, 160, 60, 0.5); }

        /* ===== प्रिंट स्टाइल ===== */
        @media print {
            #bgCanvas, .bg-overlay, .audio-player, .nav-btn, .download-btn, .share-btn, .ved-tabs { display: none !important; }
            body { background: #fff; color: #000; }
            .richa-card, .vyakhya-card { background: #fff; border: 1px solid #ccc; }
            .sanskrit-text { color: #8B4513; text-shadow: none; }
        }

        /* ===== रिड्यूस्ड मोशन ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- बैकग्राउंड कैनवास -->
    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- मुख्य कंटेंट -->
    <main class="main-content min-h-screen py-6 px-4 md:px-8">
        <div class="max-w-3xl mx-auto">

            <!-- हेडर -->
            <header class="text-center mb-8 fade-in">
                <div class="inline-flex items-center gap-3 mb-4">
                    <span class="text-3xl om-pulse" style="color: var(--accent-bright);">ॐ</span>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold tracking-wide" style="color: var(--accent-bright);">
                            वैदिक ऋचा
                        </h1>
                        <p class="text-xs md:text-sm tracking-widest" style="color: var(--muted);">
                            DAILY VEDIC HYMN
                        </p>
                    </div>
                    <span class="text-3xl om-pulse" style="color: var(--accent-bright);">ॐ</span>
                </div>
                <p class="text-sm" style="color: var(--muted);">
                    प्रतिदिन एक ऋचा — वेदों का अमरत्व
                </p>
            </header>

            <!-- वेद चयन टैब्स -->
            <nav class="ved-tabs flex flex-wrap justify-center gap-2 mb-6 fade-in" aria-label="वेद चयन">
                <button class="ved-tab active" data-ved="rigveda">ऋग्वेद</button>
                <button class="ved-tab" data-ved="yajurveda">यजुर्वेद</button>
                <button class="ved-tab" data-ved="samaveda">सामवेद</button>
                <button class="ved-tab" data-ved="atharvaveda">अथर्ववेद</button>
            </nav>

            <!-- तारीख और काउंटर -->
            <div class="flex justify-between items-center mb-4 fade-in">
                <p class="text-xs" style="color: var(--muted);" id="dateDisplay"></p>
                <p class="text-xs" style="color: var(--muted);" id="counterDisplay"></p>
            </div>

            <!-- ऋचा कार्ड -->
            <section class="richa-card p-6 md:p-10 mb-6 fade-in" id="richaCard">
                <!-- दीपक और मंत्र नंबर -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <svg class="diya-flame" width="28" height="36" viewBox="0 0 28 36" fill="none" aria-hidden="true">
                            <ellipse cx="14" cy="8" rx="7" ry="8" fill="url(#flameGrad)" opacity="0.9"/>
                            <ellipse cx="14" cy="10" rx="4" ry="5" fill="#fff3b0" opacity="0.7"/>
                            <rect x="10" y="16" width="8" height="4" rx="1" fill="#8B6914"/>
                            <path d="M6 20 Q14 28 22 20" stroke="#8B6914" stroke-width="2" fill="none"/>
                            <defs>
                                <radialGradient id="flameGrad" cx="0.5" cy="0.8" r="0.6">
                                    <stop offset="0%" stop-color="#fff7cc"/>
                                    <stop offset="40%" stop-color="#f0a030"/>
                                    <stop offset="100%" stop-color="#c04000" stop-opacity="0.6"/>
                                </radialGradient>
                            </defs>
                        </svg>
                        <span class="text-xs tracking-wider" style="color: var(--muted);" id="mantraNumber"></span>
                    </div>
                    <div class="flex gap-2">
                        <button class="share-btn" onclick="shareRicha()" title="शेयर करें" aria-label="शेयर करें">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <button class="share-btn" onclick="copyRicha()" title="कॉपी करें" aria-label="कॉपी करें">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                </div>

                <!-- संस्कृत ऋचा -->
                <div class="font-shloka sanskrit-text mb-6" id="sanskritText"></div>

                <!-- पद-पद अर्थ -->
                <div class="text-center mb-6">
                    <p class="text-xs tracking-wider mb-2" style="color: var(--muted);">पद-पद अर्थ</p>
                    <p class="text-sm leading-relaxed" style="color: var(--text); opacity: 0.8;" id="wordMeaning"></p>
                </div>

                <!-- ऑडियो प्लेयर -->
                <div class="audio-player mb-2">
                    <div class="flex items-center gap-4">
                        <button class="play-btn" id="playBtn" onclick="toggleAudio()" aria-label="बजाएँ / रोकें">
                            <i class="fas fa-play" id="playIcon"></i>
                        </button>
                        <div class="flex-1">
                            <div class="flex items-center gap-3">
                                <span class="text-xs" style="color: var(--muted);" id="currentTime">0:00</span>
                                <div class="progress-track flex-1" id="progressTrack" onclick="seekAudio(event)">
                                    <div class="progress-fill" id="progressFill"></div>
                                </div>
                                <span class="text-xs" style="color: var(--muted);" id="totalTime">0:00</span>
                            </div>
                            <div class="flex items-center gap-2 mt-2">
                                <div class="flex items-end gap-[2px] h-5" id="waveform" aria-hidden="true"></div>
                                <span class="text-xs ml-2" style="color: var(--muted);">AI संस्कृत उच्चारण</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- व्याख्या शीर्षक -->
            <div class="flex items-center gap-3 mb-4 fade-in">
                <div class="h-px flex-1" style="background: linear-gradient(90deg, transparent, var(--border));"></div>
                <h2 class="text-sm tracking-widest font-semibold" style="color: var(--accent);">
                    <i class="fas fa-om mr-2"></i>आचार्यों की व्याख्या
                </h2>
                <div class="h-px flex-1" style="background: linear-gradient(270deg, transparent, var(--border));"></div>
            </div>

            <!-- व्याख्या कार्ड्स -->
            <div class="space-y-4 mb-8" id="vyakhyaContainer"></div>

            <!-- नेविगेशन -->
            <div class="flex justify-between items-center mb-8 fade-in">
                <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">
                    <i class="fas fa-chevron-left mr-2"></i>पिछली ऋचा
                </button>
                <button class="nav-btn" id="randomBtn" onclick="randomRicha()">
                    <i class="fas fa-random mr-2"></i>कोई भी
                </button>
                <button class="nav-btn" id="nextBtn" onclick="navigate(1)">
                    अगली ऋचा<i class="fas fa-chevron-right ml-2"></i>
                </button>
            </div>

            <!-- डाउनलोड सेक्शन -->
            <section class="richa-card p-6 mb-8 fade-in">
                <h3 class="text-sm font-semibold mb-4 text-center tracking-wider" style="color: var(--accent);">
                    <i class="fas fa-download mr-2"></i>इमेज डाउनलोड करें
                </h3>
                <p class="text-xs text-center mb-4" style="color: var(--muted);">
                    AI जनरेटेड सुंदर छवि — सोशल मीडिया शेयर के लिए
                </p>
                <div class="flex flex-wrap justify-center gap-3">
                    <button class="download-btn" onclick="downloadImage('warm')">
                        <i class="fas fa-fire mr-2"></i>सूर्योदय थीम
                    </button>
                    <button class="download-btn" onclick="downloadImage('dark')">
                        <i class="fas fa-moon mr-2"></i>रात्रि ध्यान थीम
                    </button>
                    <button class="download-btn" onclick="downloadImage('golden')">
                        <i class="fas fa-sun mr-2"></i>स्वर्ण थीम
                    </button>
                </div>
                <!-- प्रीव्यू -->
                <div class="mt-4 flex justify-center">
                    <canvas id="previewCanvas" width="540" height="720" style="border-radius: 12px; max-width: 100%; height: auto; border: 1px solid var(--border); display: none;"></canvas>
                </div>
            </section>

            <!-- फुटर -->
            <footer class="text-center py-6 fade-in">
                <p class="text-xs" style="color: var(--muted);">
                    ॐ शान्तिः शान्तिः शान्तिः
                </p>
                <p class="text-xs mt-2" style="color: rgba(138,117,96,0.5);">
                    वैदिक ऋचा — AI प्रेरित दैनिक वेद अध्ययन
                </p>
            </footer>
        </div>
    </main>

    <!-- टोस्ट -->
    <div class="toast" id="toast"></div>

    <!-- ऑडियो (छुपा हुआ) -->
    <audio id="audioElement" preload="none"></audio>

    <script>
    // ===== ऋचा डेटा =====
    const richaDB = {
        rigveda: [
            {
                id: 'rv-1-1-1',
                mandal: '1', sukta: '1', mantra: '1',
                devanagari: 'अग्निमीळे पुरोहितं यज्ञस्य देवमृत्विजम् । होतारं रत्नधातमम् ॥',
                transliteration: 'Agnimīḷe purohitaṃ yajñasya devamṛtvijam | Hotāraṃ ratnadhātamam ||',
                wordMeaning: 'अग्निम् — अग्नि को; ईळे — मैं स्तुति करता हूँ; पुरोहितम् — पुरोहित को; यज्ञस्य — यज्ञ के; देवम् — देवता को; ऋत्विजम् — ऋत्विज् को; होतारम् — होता को; रत्नधातमम् — रत्नों (धन-सम्पदा) के दाता को।',
                vyakhya: [
                    {
                        guru: 'आदि शंकराचार्य',
                        period: '8वीं शताब्दी',

                        text: '"सह" का गहरा अर्थ है — गुरु और शिष्य में वास्तव में कोई भेद नहीं — दोनों एक ही चेतना के दो पहलू। "तेजस्वी अधीतम्" — अध्ययन जो केवल बौद्धिक न हो, चेतना को तेजस्वी बनाए। "मा विद्विषावहै" — अहंकार-द्वेष से चेतना का विकास रुक जाता है।'
                    },
                    {
                        guru: 'स्वामी विवेकानन्द',
                        period: '19-20वीं शताब्दी',
                        color: '#7070c0',
                        initials: 'वि',
                        text: 'यह मंत्र भारतीय शिक्षा-दर्शन का सार है! पश्चिम में शिक्षक-छात्र संबंध व्यावसायिक है, भारत में यह आध्यात्मिक है। "सह" — एक साथ चलना; "वीर्यं" — बल पैदा करना; "मा विद्विषावहै" — ईर्ष्या से बचना। यही वह आदर्श है जिसने भारत को हजारों वर्ष ज्ञान-प्रधान बनाए रखा!'
                    }
                ]
            }
        ]
    };

    // ===== स्टेट =====
    let currentVed = 'rigveda';
    let currentIndex = 0;
    let isPlaying = false;
    let audioContext = null;
    let audioNodes = [];
    let audioStartTime = 0;
    let audioDuration = 0;
    let progressInterval = null;

    // ===== डेट प्राप्त करें =====
    function getTodayIndex() {
        const start = new Date(2025, 0, 1);
        const today = new Date();
        const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
        return diff;
    }

    function getCurrentRicha() {
        const list = richaDB[currentVed];
        if (!list || list.length === 0) return null;
        return list[currentIndex % list.length];
    }

    // ===== UI अपडेट =====
    function updateUI() {
        const richa = getCurrentRicha();
        if (!richa) return;

        // तारीख
        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('dateDisplay').textContent = today.toLocaleDateString('hi-IN', options);

        // काउंटर
        const list = richaDB[currentVed];
        document.getElementById('counterDisplay').textContent =
            `${richaDB[currentVed] === richaDB.rigveda ? 'ऋग्वेद' :
              richaDB[currentVed] === richaDB.yajurveda ? 'यजुर्वेद' :
              richaDB[currentVed] === richaDB.samaveda ? 'सामवेद' : 'अथर्ववेद'} — ${currentIndex + 1} / ${list.length}`;

        // मंत्र नंबर
        document.getElementById('mantraNumber').textContent =
            `मंडल ${richa.mandal}` + (richa.sukta !== '-' ? ` | सूक्त ${richa.sukta}` : '') + ` | मंत्र ${richa.mantra}`;

        // संस्कृत ऋचा
        document.getElementById('sanskritText').textContent = richa.devanagari;

        // पद-पद अर्थ
        document.getElementById('wordMeaning').textContent = richa.wordMeaning;

        // व्याख्या कार्ड्स
        const container = document.getElementById('vyakhyaContainer');
        container.innerHTML = '';
        richa.vyakhya.forEach((v, i) => {
            const card = document.createElement('div');
            card.className = 'vyakhya-card fade-in';
            card.style.setProperty('--guru-color', v.color);
            card.style.transitionDelay = `${i * 0.1}s`;
            card.innerHTML = `
                <div class="flex items-center gap-3 mb-3">
                    <div class="guru-avatar" style="background: ${v.color}20; color: ${v.color}; border: 1px solid ${v.color}40;">
                        ${v.initials}
                    </div>
                    <div>
                        <h4 class="text-sm font-bold" style="color: ${v.color};">${v.guru}</h4>
                        <p class="text-xs" style="color: var(--muted);">${v.period}</p>
                    </div>
                </div>
                <p class="text-sm leading-relaxed" style="color: var(--text); opacity: 0.85;">${v.text}</p>
            `;
            container.appendChild(card);
        });

        // नेविगेशन बटन
        document.getElementById('prevBtn').disabled = currentIndex <= 0;
        document.getElementById('nextBtn').disabled = currentIndex >= list.length - 1;

        // ऑडियो रीसेट
        stopAudio();

        // प्रीव्यू कैनवास अपडेट
        renderPreviewCanvas('warm');

        // फेड-इन एनिमेशन
        requestAnimationFrame(() => {
            document.querySelectorAll('.fade-in').forEach(el => {
                el.classList.add('visible');
            });
        });
    }

    // ===== नेविगेशन =====
    function navigate(dir) {
        const list = richaDB[currentVed];
        const newIndex = currentIndex + dir;
        if (newIndex < 0 || newIndex >= list.length) return;
        currentIndex = newIndex;

        // फेड-आउट इफेक्ट
        document.querySelectorAll('.fade-in').forEach(el => el.classList.remove('visible'));
        setTimeout(() => updateUI(), 200);
    }

    function randomRicha() {
        // सभी वेदों से रैंडम
        const allVeds = Object.keys(richaDB);
        const randomVed = allVeds[Math.floor(Math.random() * allVeds.length)];
        const randomIndex = Math.floor(Math.random() * richaDB[randomVed].length);
        currentVed = randomVed;
        currentIndex = randomIndex;

        // टैब अपडेट
        document.querySelectorAll('.ved-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.ved === currentVed);
        });

        document.querySelectorAll('.fade-in').forEach(el => el.classList.remove('visible'));
        setTimeout(() => updateUI(), 200);
    }

    // ===== वेद टैब =====
    document.querySelectorAll('.ved-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            const ved = tab.dataset.ved;
            if (richaDB[ved].length === 0) {
                showToast('इस वेद की ऋचाएँ शीघ्र जोड़ी जाएँगी');
                return;
            }
            currentVed = ved;
            currentIndex = 0;
            document.querySelectorAll('.ved-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.fade-in').forEach(el => el.classList.remove('visible'));
            setTimeout(() => updateUI(), 200);
        });
    });

    // ===== ऑडियो सिंथेसिस =====
    function createOscillator(freq, type, gainVal, startTime, duration) {
        if (!audioContext) return;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.05);
        gain.gain.linearRampToValueAtTime(gainVal * 0.7, startTime + duration * 0.5);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
        audioNodes.push(osc);
    }

    function playChantAudio() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') audioContext.resume();

        const richa = getCurrentRicha();
        if (!richa) return;

        // ऋचा से आवृत्तियाँ बनाएँ
        const text = richa.devanagari;
        const chars = text.replace(/[।॥\s]/g, '').split('');
        audioNodes = [];

        const baseFreq = 220; // A3
        const now = audioContext.currentTime + 0.1;
        let t = now;
        const noteDuration = 0.35;

        // वैदिक स्वर स्केल (शुद्ध, कोमल, तीव्र)
        const scale = [0, 1.122, 1.335, 1.498, 1.682, 2.0, 2.245, 2.52, 2.670, 2.997, 3.364];

        // स्वर-मैपिंग: अ-उ = निचले स्वर, ऋ-ॠ = मध्य, ए-औ = ऊँचे
        const charFreqMap = {};
        'अआइईउऊऋएऐओऔ'.split('').forEach((c, i) => {
            charFreqMap[c] = scale[Math.min(i, scale.length - 1)];
        });

        // विशेष स्वर
        charFreqMap['ं'] = 1.0;
        charFreqMap['ः'] = 0.9;

        let prevMult = 1.0;

        chars.forEach((char, i) => {
            const mult = charFreqMap[char] || (0.8 + (char.charCodeAt(0) % 7) * 0.3);
            const freq = baseFreq * mult;

            // मुख्य टोन
            createOscillator(freq, 'sine', 0.12, t, noteDuration);

            // हार्मोनिक्स
            createOscillator(freq * 2, 'sine', 0.03, t, noteDuration * 0.8);
            createOscillator(freq * 3, 'sine', 0.01, t, noteDuration * 0.5);

            // तानपुरा-जैसा ड्रोन (कुछ नोट्स पर)
            if (i % 3 === 0) {
                createOscillator(baseFreq, 'triangle', 0.04, t, noteDuration * 1.5);
                createOscillator(baseFreq * 1.5, 'triangle', 0.02, t, noteDuration * 1.5);
            }

            // विराम (दंड) पर लंबा विराम
            const origText = richa.devanagari;
            const posMap = [];
            let ci = 0;
            for (let j = 0; j < origText.length && posMap.length < chars.length; j++) {
                if (origText[j] !== ' ' && origText[j] !== '।' && origText[j] !== '॥') {
                    posMap.push(j);
                }
            }

            let gap = noteDuration * 0.9;
            if (posMap[i] !== undefined) {
                // दंड (।) के बाद विराम
                if (origText[posMap[i] + 1] === '।' || origText[posMap[i] + 2] === '।') {
                    gap = noteDuration * 3;
                }
                // द्विदंड (॥) के बाद बड़ा विराम
                if (origText.indexOf('॥', posMap[i]) === posMap[i] + 1 || origText.indexOf('॥', posMap[i]) === posMap[i] + 2) {
                    gap = noteDuration * 6;
                }
            }

            t += gap;
            prevMult = mult;
        });

        audioStartTime = now;
        audioDuration = t - now;
        document.getElementById('totalTime').textContent = formatTime(audioDuration);

        // प्रोग्रेस अपडेट
        progressInterval = setInterval(updateProgress, 100);

        // ऑडियो खत्म होने पर
        setTimeout(() => {
            if (isPlaying) stopAudio();
        }, audioDuration * 1000 + 200);
    }

    function toggleAudio() {
        if (isPlaying) {
            stopAudio();
        } else {
            isPlaying = true;
            document.getElementById('playBtn').classList.add('playing');
            document.getElementById('playIcon').className = 'fas fa-pause';
            document.querySelectorAll('.wave-bar').forEach(bar => bar.classList.add('active'));
            playChantAudio();
        }
    }

    function stopAudio() {
        isPlaying = false;
        document.getElementById('playBtn').classList.remove('playing');
        document.getElementById('playIcon').className = 'fas fa-play';
        document.querySelectorAll('.wave-bar').forEach(bar => bar.classList.remove('active'));
        document.getElementById('progressFill').style.width = '0%';
        document.getElementById('currentTime').textContent = '0:00';

        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }

        audioNodes.forEach(node => {
            try { node.stop(); } catch(e) {}
        });
        audioNodes = [];
    }

    function updateProgress() {
        if (!audioContext || !isPlaying) return;
        const elapsed = audioContext.currentTime - audioStartTime;
        const pct = Math.min((elapsed / audioDuration) * 100, 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('currentTime').textContent = formatTime(Math.min(elapsed, audioDuration));
    }

    function seekAudio(e) {
        // सीक फंक्शन (सिंथेसिस्ड ऑडियो में सीमित)
        showToast('सिंथेसिस्ड ऑडियो में सीक समर्थित नहीं');
    }

    function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
    }

    // ===== वेवफॉर्म बार्स बनाएँ =====
    function createWaveformBars() {
        const container = document.getElementById('waveform');
        container.innerHTML = '';
        for (let i = 0; i < 20; i++) {
            const bar = document.createElement('div');
            bar.className = 'wave-bar';

            container.appendChild(bar);

    }

    // ===== बैकग्राउंड कैनवास (पार्टिकल्स) =====
    function initBackground() {
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        const particles = [];
        const particleCount = 60;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // पार्टिकल्स बनाएँ
        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 2 + 0.5,
                vx: (Math.random() - 0.5) * 0.3,
                vy: -Math.random() * 0.4 - 0.1,
                alpha: Math.random() * 0.5 + 0.1,
                pulse: Math.random() * Math.PI * 2
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.pulse += 0.02;

                // स्क्रीन से बाहर जाने पर वापस
                if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
                if (p.x < -10) p.x = w + 10;
                if (p.x > w + 10) p.x = -10;

                const a = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));
                const r = Math.max(0.1, p.r);

                // ग्लो
                const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4);
                grad.addColorStop(0, `rgba(212, 160, 60, ${a})`);
                grad.addColorStop(0.5, `rgba(180, 120, 30, ${a * 0.3})`);
                grad.addColorStop(1, `rgba(180, 120, 30, 0)`);

                ctx.beginPath();
                ctx.arc(p.x, p.y, r * 4, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // कोर
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(240, 200, 100, ${a * 0.8})`;
                ctx.fill();
            });

            requestAnimationFrame(draw);
        }
        draw();
    }

    // ===== प्रीव्यू कैनवास (डाउनलोड इमेज) =====
    function renderPreviewCanvas(theme) {
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const W = 540, H = 720;
        canvas.width = W;
        canvas.height = H;

        const richa = getCurrentRicha();
        if (!richa) return;

        // बैकग्राउंड
        let bgGrad;
        if (theme === 'warm') {
            bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#1a0800');
            bgGrad.addColorStop(0.4, '#2a1005');
            bgGrad.addColorStop(0.7, '#1a0800');
            bgGrad.addColorStop(1, '#0d0400');
        } else if (theme === 'dark') {
            bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#050510');
            bgGrad.addColorStop(0.5, '#0a0820');
            bgGrad.addColorStop(1, '#030308');
        } else {
            bgGrad = ctx.createLinearGradient(0, 0, 0, H);
            bgGrad.addColorStop(0, '#1a1400');
            bgGrad.addColorStop(0.3, '#2a2000');
            bgGrad.addColorStop(0.6, '#1a1400');
            bgGrad.addColorStop(1, '#100c00');
        }
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // सजावटी सर्कल
        const centerX = W / 2;
        const centerY = 200;
        const accentColor = theme === 'dark' ? '#4060a0' : '#d4a03c';

        for (let i = 3; i >= 1; i--) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, 60 + i * 30, 0, Math.PI * 2);
            ctx.strokeStyle = accentColor + (i === 1 ? '30' : '15');
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // ॐ चिह्न
        ctx.font = '48px "Tiro Devanagari Hindi", serif';
        ctx.fillStyle = accentColor + '80';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ॐ', centerX, centerY);

        // सजावटी लाइनें
        ctx.strokeStyle = accentColor + '30';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(40 + i * 5, 300);
            ctx.lineTo(W - 40 - i * 5, 300);
            ctx.stroke();
        }

        // वेद नाम
        const vedName = currentVed === 'rigveda' ? 'ऋग्वेद' :
                        currentVed === 'yajurveda' ? 'यजुर्वेद' :
                        currentVed === 'samaveda' ? 'सामवेद' : 'अथर्ववेद';
        ctx.font = '600 14px "Noto Sans Devanagari", sans-serif';
        ctx.fillStyle = accentColor + 'aa';
        ctx.fillText(vedName + ' — मंडल ' + richa.mandal + (richa.sukta !== '-' ? ' | सूक्त ' + richa.sukta : '') + ' | मंत्र ' + richa.mantra, centerX, 330);

        // संस्कृत ऋचा
        ctx.font = '26px "Tiro Devanagari Hindi", serif';
        ctx.fillStyle = theme === 'dark' ? '#a0b0e0' : '#f0c040';

        const lines = wrapText(ctx, richa.devanagari, W - 80);
        let y = 390;
        lines.forEach(line => {
            ctx.fillText(line, centerX, y);
            y += 42;
        });

        // निचली सजावटी लाइनें
        const bottomY = y + 20;
        ctx.strokeStyle = accentColor + '30';
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.moveTo(40 + i * 5, bottomY);
            ctx.lineTo(W - 40 - i * 5, bottomY);
            ctx.stroke();
        }

        // पहली व्याख्या (शंकराचार्य)
        const firstVyakhya = richa.vyakhya[0];
        ctx.font = '600 12px "Noto Sans Devanagari", sans-serif';
        ctx.fillStyle = firstVyakhya.color + 'cc';
        ctx.textAlign = 'left';
        ctx.fillText('— ' + firstVyakhya.guru, 50, bottomY + 30);

        ctx.font = '13px "Noto Sans Devanagari", sans-serif';
        ctx.fillStyle = '#c0b0a0';
        const vyakhyaLines = wrapText(ctx, firstVyakhya.text, W - 100);
        let vy = bottomY + 55;
        vyakhyaLines.slice(0, 4).forEach(line => {
            ctx.fillText(line, 50, vy);
            vy += 22;
        });
        if (vyakhyaLines.length > 4) {
            ctx.fillStyle = '#8a7560';
            ctx.fillText('...', 50, vy);
        }

        // फुटर
        ctx.textAlign = 'center';
        ctx.font = '11px "Noto Sans Devanagari", sans-serif';
        ctx.fillStyle = '#5a4a3a';
        ctx.fillText('ॐ शान्तिः शान्तिः शान्तिः', centerX, H - 40);
        ctx.font = '10px "Noto Sans Devanagari", sans-serif';
        ctx.fillStyle = '#3a3028';
        const today = new Date();
        ctx.fillText(today.toLocaleDateString('hi-IN'), centerX, H - 22);
    }

    function wrapText(ctx, text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let currentLine = '';

        words.forEach(word => {
            const testLine = currentLine ? currentLine + ' ' + word : word;
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && currentLine) {
                lines.push(currentLine);
                currentLine = word;
            } else {
                currentLine = testLine;
            }
        });
        if (currentLine) lines.push(currentLine);
        return lines;
    }

    // ===== डाउनलोड इमेज =====
    function downloadImage(theme) {
        renderPreviewCanvas(theme);

    // ===== शेयर / कॉपी =====
    function shareRicha() {
        const richa = getCurrentRicha();
        if (!richa) return;
        const text = `ॐ ${richa.devanagari}\n\n— वैदिक ऋचा (दैनिक वेद अध्ययन)`;

        if (navigator.share) {
            navigator.share({ title: 'वैदिक ऋचा', text: text }).catch(() => {});
        } else {
            copyToClipboard(text);
        }
    }

    function copyRicha() {
        const richa = getCurrentRicha();
        if (!richa) return;
        const text = `ॐ ${richa.devanagari}\n\nपद-पद अर्थ: ${richa.wordMeaning}\n\n— वैदिक ऋचा (दैनिक वेद अध्ययन)`;
        copyToClipboard(text);
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            showToast('ऋचा कॉपी हो गई!');
        }).catch(() => {
            // फॉलबैक
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('ऋचा कॉपी हो गई!');
        });
    }

    // ===== टोस्ट =====
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== स्क्रॉल एनिमेशन =====
    function initScrollAnimations() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    }

    // ===== कीबोर्ड नेविगेशन =====
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === ' ') { e.preventDefault(); toggleAudio(); }
    });

    // ===== इनिशियलाइज़ =====
    function init() {
        // आज की ऋचा
        const dayIndex = getTodayIndex();
        const totalRichas = Object.values(richaDB).reduce((sum, list) => sum + list.length, 0);
        let remaining = dayIndex % totalRichas;

        // वेद चुनें
        for (const [ved, list] of Object.entries(richaDB)) {
            if (remaining < list.length) {
                currentVed = ved;
                currentIndex = remaining;
                break;
            }
            remaining -= list.length;
        }

        createWaveformBars();
        initBackground();
        updateUI();
        initScrollAnimations();
    }

    // DOM तैयार होने पर
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
